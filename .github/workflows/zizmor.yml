name: zizmor

# Audits the workflows and dependabot.yml; findings go to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependabot auto-merge runs it for a merge that started no push workflows
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # A new zizmor can add audits: take it in a reviewed change.
          version: 1.31.1
